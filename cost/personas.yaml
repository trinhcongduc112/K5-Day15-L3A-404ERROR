# Mô phỏng chi phí khi dùng thật — điền ở guide bước 4.2.
# Ôn lại: ngày 13, ngày 1, ngày 14 · lab ngày 13, lab ngày 14.
# Mọi số phải có nguồn (data / phỏng vấn / khảo sát / quy mô khoá có nguồn) hoặc ghi rõ "(tự ước tính)".
# Chạy: python run.py simulate --try   (10 phiên, kiểm khung — làm trước CP3)
#       python run.py simulate         (đủ số phiên dưới đây — bản nộp CP4)
# Thay mọi dòng mẫu của khung bằng số và nguồn của nhóm; simulate nhắc nếu còn sót.

sessions: 50        # số phiên mô phỏng — bản nộp ≥50
seed: 42            # giữ cố định để chạy lại ra cùng chuỗi phiên

users:              # số người dùng thật nếu đưa vào dùng — 3 kịch bản, ở quy mô thật của sản phẩm
                    # Track E: người dùng cá nhân ghi chi tiêu từ hóa đơn
  low: 30
  base: 100
  high: 300
  source: "30 người theo kịch bản thử spec.md §2; mức 100 (cơ sở) và 300 (cao) là (tự ước tính) cho sản phẩm nhật ký chi tiêu cá nhân"

personas:           # ≥3 kiểu người dùng; share cộng lại = 1 (tỉ lệ từ khảo sát 24 người evidence/survey/results.csv)
  - name: dung_it
    share: 0.25             # 6/24 người khảo sát chi dưới 10 lượt/tuần
    uses_per_month: 8       # (tự ước tính) ~2 phiên/tuần (chụp hóa đơn lẻ hoặc tra cứu cuối tuần)
    turns_per_session: 2    # số lượt hỏi trong một phiên
    source: "evidence/survey/results.csv (6/24 người dưới 10 lượt/tuần); số phiên/tháng (tự ước tính)"
  - name: dung_vua
    share: 0.375            # 9/24 người khảo sát chi 10–20 lượt/tuần
    uses_per_month: 16      # (tự ước tính) ~4 phiên/tuần (phù hợp giả định 12–16 hóa đơn/tháng ở spec.md §2)
    turns_per_session: 3
    source: "evidence/survey/results.csv (9/24 người 10–20 lượt/tuần) + spec.md §2; số phiên/tháng (tự ước tính)"
  - name: dung_nhieu
    share: 0.375            # 9/24 người khảo sát chi >20 lượt/tuần (4 người 20–35 + 5 người >35)
    uses_per_month: 30      # (tự ước tính) ~1 phiên/ngày ghi hóa đơn và theo dõi chi tiêu hằng ngày
    turns_per_session: 4
    source: "evidence/survey/results.csv (9/24 người >20 lượt/tuần); số phiên/tháng (tự ước tính)"
# Mỗi lượt hỏi lấy ngẫu nhiên một đầu vào trong eval/benchmark.csv (type thuong và kho).
# Persona hỏi kiểu riêng: thêm vào persona đó
#     types: [thuong, kho, tu_choi]
# hoặc
#     inputs: ["câu hỏi kiểu 1", "câu hỏi kiểu 2"]

prices:             # USD / 1 triệu token — ≥2 mức model (có link + ngày xem)
  - model: gpt-5.4-nano
    input: 0.20
    output: 1.25
    source: "https://openai.com/api/pricing/ (xem 28/11/2026)"
  - model: gpt-5.4-mini
    input: 0.75
    output: 4.50
    source: "https://openai.com/api/pricing/ (xem 28/11/2026)"

usd_to_vnd:         # tuỳ chọn: điền thì bản tóm tắt in thêm tiền Việt
  rate: 25400
  source: "(tự ước tính) tỷ giá quy đổi tham khảo 25.400 VND/USD"
